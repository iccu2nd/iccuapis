<button class="hamburger-btn" id="hamburgerBtn" type="button" aria-label="Buka menu" aria-expanded="false">

<main class="stage">
  <div class="page-head">
    <h1>Health</h1>
    <p>Status server secara langsung. Halaman ini refresh sendiri tiap beberapa detik.</p>
  </div>

  <div class="status-banner" id="statusBanner">
    <div class="status-dot-wrap">
      <span class="status-dot-ring"></span>
      <span class="status-dot" id="statusDot"></span>
    </div>
    <div class="status-banner-copy">
      <span class="status-banner-text" id="statusText">Memeriksa status...</span>
      <span class="status-banner-sub">Auto-refresh tiap 5 detik</span>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      </div>
      <div class="card-label">Server Uptime</div>
      <div class="card-value" id="uptimeValue">—</div>
    </div>
    <div class="card">
      <div class="card-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
      </div>
      <div class="card-label">Cache Entries</div>
      <div class="card-value" id="cacheValue">—</div>
    </div>
    <div class="card is-wide">
      <div class="card-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18"/><path d="M8 2v4M16 2v4"/></svg>
      </div>
      <div class="card-label">Last Checked</div>
      <div class="card-value" id="timestampValue">—</div>
    </div>
  </div>
</main>

    Health

  <div class="hamburger-menu-contacts">
    <a href="#" id="waChannelMenuItem" class="hamburger-menu-contact-link" target="_blank" rel="noopener" hidden>Saluran WhatsApp</a>

  </div>

<script src="/theme.js"></script>
<script src="/click-sound.js"></script>
<script src="/menu-contacts.js"></script>
<script>
(() => {
  'use strict';

  const el = (id) => document.getElementById(id);
  const POLL_MS = 5000;

  let baseSeconds = null;
  let baseAt = null;
  let tickTimer = null;

  function formatUptime(totalSeconds) {
    const s = Math.max(0, Math.floor(totalSeconds));
    const hours = Math.floor(s / 3600);
    const minutes = Math.floor((s % 3600) / 60);
    const seconds = s % 60;
    return `${hours}h ${minutes}m ${seconds}s`;
  }

  function tick() {
    if (baseSeconds === null) return;
    const elapsed = (Date.now() - baseAt) / 1000;
    el('uptimeValue').textContent = formatUptime(baseSeconds + elapsed);
  }

  function setDown() {
    el('statusBanner').classList.add('is-down');
    el('statusText').textContent = 'Server tidak merespons';
    el('uptimeValue').textContent = '—';
    el('cacheValue').textContent = '—';
  }

  async function poll() {
    try {
      const res = await fetch('/api/health', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      el('statusBanner').classList.remove('is-down');
      el('statusText').textContent = 'Server berjalan normal';

      if (typeof data.uptimeSeconds === 'number') {
        baseSeconds = data.uptimeSeconds;
        baseAt = Date.now();
        el('uptimeValue').textContent = formatUptime(baseSeconds);
        if (!tickTimer) tickTimer = setInterval(tick, 1000);
      }

      if (typeof data.cacheEntries === 'number') {
        el('cacheValue').textContent = data.cacheEntries.toLocaleString('id-ID');
      }

      if (data.timestamp) {
        const d = new Date(data.timestamp);
        el('timestampValue').textContent = d.toLocaleString('id-ID', {
          day: '2-digit', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
      }
    } catch (err) {
      setDown();
    }
  }

  poll();
  setInterval(poll, POLL_MS);

  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const hamburgerMenu = document.getElementById('hamburgerMenu');
  const menuOverlay = document.getElementById('menuOverlay');

  function openMenu() {
    hamburgerBtn.classList.add('is-open');
    hamburgerBtn.setAttribute('aria-expanded', 'true');
    hamburgerMenu.classList.add('is-open');
    menuOverlay.classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }
  function closeMenu() {
    hamburgerBtn.classList.remove('is-open');
    hamburgerBtn.setAttribute('aria-expanded', 'false');
    hamburgerMenu.classList.remove('is-open');
    menuOverlay.classList.remove('is-open');
    document.body.style.overflow = '';
  }
  hamburgerBtn.addEventListener('click', () => {
    if (hamburgerMenu.classList.contains('is-open')) closeMenu();
    else openMenu();
  });
  menuOverlay.addEventListener('click', closeMenu);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && hamburgerMenu.classList.contains('is-open')) closeMenu();
  });
})();
</script>

</body>
</html>
