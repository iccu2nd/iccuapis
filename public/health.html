<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Health — Sasane APIS</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFFFF;
  --panel: #FAFAFB;
  --panel-raised: #F0F1F3;
  --border: #ECECEF;
  --border-strong: #E4E6EB;
  --text: #12141C;
  --text-dim: #767B87;
  --text-faint: #9498A3;
  --accent: #17181F;
  --accent-hover: #000000;
  --accent-soft: #EFEFF1;
  --good: #2E9E5B;
  --good-soft: #E9F7EF;
  --bad: #D64545;
  --bad-soft: #FBEBEA;
  --display: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --stat: 'JetBrains Mono', ui-monospace, monospace;
  --body: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --radius: 16px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; cursor: pointer; }

.hamburger-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  transition: background 0.12s ease;
}
.hamburger-btn:hover { background: var(--panel); }
.hamburger-btn span {
  display: block;
  width: 16px;
  height: 2px;
  border-radius: 2px;
  background: var(--text);
  transition: transform 0.2s ease, opacity 0.2s ease;
}
.hamburger-btn.is-open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.hamburger-btn.is-open span:nth-child(2) { opacity: 0; }
.hamburger-btn.is-open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

.menu-overlay {
  position: fixed;
  inset: 0;
  z-index: 45;
  background: rgba(20, 22, 26, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.menu-overlay.is-open {
  opacity: 1;
  pointer-events: auto;
}

.hamburger-menu {
  position: fixed;
  top: 0;
  right: 0;
  left: auto;
  bottom: 0;
  z-index: 46;
  width: 78%;
  max-width: 300px;
  background: #fff;
  display: flex;
  flex-direction: column;
  padding: 22px 16px;
  gap: 2px;
  transform: translateX(100%);
  transition: transform 0.28s ease;
  box-shadow: -8px 0 32px rgba(20, 22, 26, 0.10);
}
.hamburger-menu.is-open {
  transform: translateX(0);
}
.hamburger-menu-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
  padding: 6px 14px 16px;
}
.hamburger-menu-item {
  padding: 13px 14px;
  border-radius: var(--radius-sm);
  font-size: 16.5px;
  font-weight: 600;
  color: var(--text);
  text-decoration: none;
  transition: background 0.12s ease;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hamburger-menu-item:hover { background: var(--panel); }
.hamburger-menu-item.is-active { color: var(--accent); background: var(--accent-soft); }
.hamburger-menu-spacer { flex: 1; }
.hamburger-menu-contacts {
  margin-top: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.hamburger-menu-contact-link {
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-dim);
  text-decoration: none;
  transition: background 0.12s ease, color 0.12s ease;
}
.hamburger-menu-contact-link:hover { background: var(--panel); color: var(--text); }

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 22px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.topbar-mark {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: var(--display);
  font-weight: 700;
  font-size: 15px;
}

.stage {
  max-width: 780px;
  margin: 0 auto;
  padding: 32px 22px 64px;
}

.page-head {
  margin-bottom: 20px;
}
.page-head h1 {
  font-family: var(--display);
  font-size: 26px;
  font-weight: 700;
  margin: 0 0 6px;
  letter-spacing: -0.01em;
}
.page-head p {
  margin: 0;
  color: var(--text-dim);
  font-size: 14.5px;
}

.status-banner {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 26px 24px;
  border-radius: 22px;
  border: 1px solid var(--border);
  background: linear-gradient(135deg, #E9F7EF 0%, #F5FCF8 60%, #FFFFFF 100%);
  margin-bottom: 16px;
  box-shadow: 0 16px 36px -20px rgba(46, 158, 91, 0.35);
  transition: background 0.3s ease, box-shadow 0.3s ease;
}
.status-banner.is-down {
  background: linear-gradient(135deg, #FBEBEA 0%, #FDF4F3 60%, #FFFFFF 100%);
  box-shadow: 0 16px 36px -20px rgba(214, 69, 69, 0.35);
}
.status-dot-wrap {
  position: relative;
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.status-dot-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--good);
  opacity: 0.18;
  animation: ring 1.8s ease-out infinite;
}
.status-banner.is-down .status-dot-ring { background: var(--bad); animation: none; opacity: 0.12; }
@keyframes ring {
  0% { transform: scale(0.5); opacity: 0.35; }
  100% { transform: scale(1); opacity: 0; }
}
.status-dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--good);
  flex-shrink: 0;
  box-shadow: 0 0 0 4px rgba(46, 158, 91, 0.16);
}
.status-banner.is-down .status-dot { background: var(--bad); box-shadow: 0 0 0 4px rgba(214, 69, 69, 0.16); }
.status-banner-copy { display: flex; flex-direction: column; gap: 2px; }
.status-banner-text {
  font-family: var(--display);
  font-weight: 700;
  font-size: 17px;
  color: var(--good);
  letter-spacing: -0.01em;
}
.status-banner.is-down .status-banner-text { color: var(--bad); }
.status-banner-sub {
  font-size: 12.5px;
  color: var(--text-faint);
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.card {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  background: #fff;
  box-shadow: 0 10px 24px -18px rgba(20, 22, 26, 0.25);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -18px rgba(20, 22, 26, 0.28); }
.card-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--accent-soft);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
}
.card-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.card-value {
  font-family: var(--stat);
  font-weight: 700;
  font-size: 23px;
  letter-spacing: -0.01em;
  background: linear-gradient(135deg, var(--text) 0%, var(--text-dim) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.card.is-wide { grid-column: 1 / -1; }
.card.is-wide .card-value { font-size: 15px; }

@media (max-width: 480px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-mark">
    <span>Sasane APIS</span>
  </div>
  <button class="hamburger-btn" id="hamburgerBtn" type="button" aria-label="Buka menu" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<main class="stage">
  <div class="page-head">
    <h1>Health</h1>
    <p>Status server secara langsung. Halaman ini refresh sendiri tiap beberapa detik.</p>
  </div>

  <div class="status-banner" id="statusBanner">
    <div class="status-dot-wrap">
      <span class="status-dot-ring"></span>
      <span class="status-dot" id="statusDot"></span>
    </div>
    <div class="status-banner-copy">
      <span class="status-banner-text" id="statusText">Memeriksa status...</span>
      <span class="status-banner-sub">Auto-refresh tiap 5 detik</span>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      </div>
      <div class="card-label">Server Uptime</div>
      <div class="card-value" id="uptimeValue">—</div>
    </div>
    <div class="card">
      <div class="card-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
      </div>
      <div class="card-label">Cache Entries</div>
      <div class="card-value" id="cacheValue">—</div>
    </div>
    <div class="card is-wide">
      <div class="card-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18"/><path d="M8 2v4M16 2v4"/></svg>
      </div>
      <div class="card-label">Last Checked</div>
      <div class="card-value" id="timestampValue">—</div>
    </div>
  </div>
</main>

<div class="menu-overlay" id="menuOverlay"></div>

<div class="hamburger-menu" id="hamburgerMenu">
  <div class="hamburger-menu-title">Menu</div>
  <a href="/" class="hamburger-menu-item">
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/></svg>
    Beranda
  </a>
  <a href="/docs" class="hamburger-menu-item">
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    Docs
  </a>
  <a href="/logs" class="hamburger-menu-item">
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v2H4V4zm0 7h16v2H4v-2zm0 7h10v2H4v-2z" fill="currentColor"/></svg>
    Request Log
  </a>
  <a href="/health" class="hamburger-menu-item is-active">
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    Health
  </a>
  <div class="hamburger-menu-spacer"></div>
  <div class="hamburger-menu-contacts">
    <a href="#" id="waChannelMenuItem" class="hamburger-menu-contact-link" target="_blank" rel="noopener" hidden>Saluran WhatsApp</a>
    <a href="#" id="ownerContactMenuItem" class="hamburger-menu-contact-link" target="_blank" rel="noopener" hidden>Contact Owner</a>
  </div>
</div>

<script src="/click-sound.js"></script>
<script src="/menu-contacts.js"></script>
<script>
(() => {
  'use strict';

  const el = (id) => document.getElementById(id);
  const POLL_MS = 5000;

  let baseSeconds = null;
  let baseAt = null;
  let tickTimer = null;

  function formatUptime(totalSeconds) {
    const s = Math.max(0, Math.floor(totalSeconds));
    const hours = Math.floor(s / 3600);
    const minutes = Math.floor((s % 3600) / 60);
    const seconds = s % 60;
    return `${hours}h ${minutes}m ${seconds}s`;
  }

  function tick() {
    if (baseSeconds === null) return;
    const elapsed = (Date.now() - baseAt) / 1000;
    el('uptimeValue').textContent = formatUptime(baseSeconds + elapsed);
  }

  function setDown() {
    el('statusBanner').classList.add('is-down');
    el('statusText').textContent = 'Server tidak merespons';
    el('uptimeValue').textContent = '—';
    el('cacheValue').textContent = '—';
  }

  async function poll() {
    try {
      const res = await fetch('/api/health', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      el('statusBanner').classList.remove('is-down');
      el('statusText').textContent = 'Server berjalan normal';

      if (typeof data.uptimeSeconds === 'number') {
        baseSeconds = data.uptimeSeconds;
        baseAt = Date.now();
        el('uptimeValue').textContent = formatUptime(baseSeconds);
        if (!tickTimer) tickTimer = setInterval(tick, 1000);
      }

      if (typeof data.cacheEntries === 'number') {
        el('cacheValue').textContent = data.cacheEntries.toLocaleString('id-ID');
      }

      if (data.timestamp) {
        const d = new Date(data.timestamp);
        el('timestampValue').textContent = d.toLocaleString('id-ID', {
          day: '2-digit', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
      }
    } catch (err) {
      setDown();
    }
  }

  poll();
  setInterval(poll, POLL_MS);

  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const hamburgerMenu = document.getElementById('hamburgerMenu');
  const menuOverlay = document.getElementById('menuOverlay');

  function openMenu() {
    hamburgerBtn.classList.add('is-open');
    hamburgerBtn.setAttribute('aria-expanded', 'true');
    hamburgerMenu.classList.add('is-open');
    menuOverlay.classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }
  function closeMenu() {
    hamburgerBtn.classList.remove('is-open');
    hamburgerBtn.setAttribute('aria-expanded', 'false');
    hamburgerMenu.classList.remove('is-open');
    menuOverlay.classList.remove('is-open');
    document.body.style.overflow = '';
  }
  hamburgerBtn.addEventListener('click', () => {
    if (hamburgerMenu.classList.contains('is-open')) closeMenu();
    else openMenu();
  });
  menuOverlay.addEventListener('click', closeMenu);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && hamburgerMenu.classList.contains('is-open')) closeMenu();
  });
})();
</script>

</body>
</html>
