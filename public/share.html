<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Share Code — Sasane APIS</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFFFF;
  --panel: #FAFAFB;
  --panel-raised: #F0F1F3;
  --border: #ECECEF;
  --border-strong: #E4E6EB;
  --text: #12141C;
  --text-dim: #767B87;
  --text-faint: #9498A3;
  --accent: #17181F;
  --accent-hover: #000000;
  --accent-soft: #EFEFF1;
  --good: #2E9E5B;
  --good-soft: #E9F7EF;
  --bad: #D64545;
  --bad-soft: #FBEBEA;
  --display: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --stat: 'JetBrains Mono', ui-monospace, monospace;
  --body: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --radius: 16px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; cursor: pointer; }

.hamburger-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  transition: background 0.12s ease;
}
.hamburger-btn:hover { background: var(--panel); }
.hamburger-btn span {
  display: block;
  width: 16px;
  height: 2px;
  border-radius: 2px;
  background: var(--text);
  transition: transform 0.2s ease, opacity 0.2s ease;
}
.hamburger-btn.is-open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.hamburger-btn.is-open span:nth-child(2) { opacity: 0; }
.hamburger-btn.is-open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

.menu-overlay {
  position: fixed;
  inset: 0;
  z-index: 45;
  background: rgba(20, 22, 26, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.menu-overlay.is-open { opacity: 1; pointer-events: auto; }

.hamburger-menu {
  position: fixed;
  top: 0;
  left: 0;
  right: auto;
  bottom: 0;
  z-index: 46;
  width: 78%;
  max-width: 300px;
  background: #fff;
  display: flex;
  flex-direction: column;
  padding: 22px 16px;
  gap: 2px;
  transform: translateX(-100%);
  transition: transform 0.28s ease;
  box-shadow: 8px 0 32px rgba(20, 22, 26, 0.10);
}
.hamburger-menu.is-open { transform: translateX(0); }
.hamburger-menu-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
  padding: 6px 14px 16px;
}
.hamburger-menu-item {
  padding: 13px 14px;
  border-radius: var(--radius-sm);
  font-size: 16.5px;
  font-weight: 600;
  color: var(--text);
  text-decoration: none;
  transition: background 0.12s ease;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hamburger-menu-item:hover { background: var(--panel); }
.hamburger-menu-item.is-active { color: var(--accent); background: var(--accent-soft); }
.hamburger-menu-spacer { flex: 1; }
.hamburger-menu-contacts {
  margin-top: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.hamburger-menu-contact-link {
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-dim);
  text-decoration: none;
  transition: background 0.12s ease, color 0.12s ease;
}
.hamburger-menu-contact-link:hover { background: var(--panel); color: var(--text); }

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 22px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.topbar-mark {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: var(--display);
  font-weight: 700;
  font-size: 15px;
}

.stage {
  max-width: 780px;
  margin: 0 auto;
  padding: 32px 22px 64px;
}

.page-head { margin-bottom: 20px; }
.page-head h1 {
  font-family: var(--display);
  font-size: 26px;
  font-weight: 700;
  margin: 0 0 6px;
  letter-spacing: -0.01em;
}
.page-head p {
  margin: 0;
  color: var(--text-dim);
  font-size: 14.5px;
}

.panel {
  border: 1px solid var(--border);
  border-radius: 20px;
  background: #fff;
  padding: 20px;
  box-shadow: 0 10px 24px -18px rgba(20, 22, 26, 0.25);
}

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.field input, .field textarea {
  width: 100%;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 11px 13px;
  font-size: 14.5px;
  font-family: var(--body);
  color: var(--text);
  background: var(--panel);
  outline: none;
  transition: border-color 0.12s ease;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea {
  font-family: var(--mono);
  font-size: 13.5px;
  min-height: 280px;
  resize: vertical;
  white-space: pre;
}

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .field { flex: 1; min-width: 160px; }

.btn {
  border: none;
  border-radius: var(--radius-sm);
  padding: 12px 20px;
  font-size: 14.5px;
  font-weight: 600;
  transition: background 0.12s ease, opacity 0.12s ease;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.5; cursor: default; }
.btn-ghost { background: var(--panel-raised); color: var(--text); }
.btn-ghost:hover { background: var(--border); }

.actions { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }

.banner {
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 13.5px;
  margin-top: 14px;
  display: none;
}
.banner.is-error { display: block; background: var(--bad-soft); color: var(--bad); }
.banner.is-good { display: block; background: var(--good-soft); color: var(--good); }

.result { margin-top: 18px; display: none; }
.result.is-open { display: block; }
.result-row {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-bottom: 8px;
  background: var(--panel);
}
.result-row-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-faint);
  width: 44px;
  flex-shrink: 0;
}
.result-row a {
  flex: 1;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result-row button {
  border: none;
  background: var(--panel-raised);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  flex-shrink: 0;
}
.result-row button:hover { background: var(--border); }
.result-note {
  font-size: 12.5px;
  color: var(--text-faint);
  margin: 4px 0 10px;
}
#deleteBtn { color: var(--bad); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-mark"><span>Sasane APIS</span></div>
  <button class="hamburger-btn" id="hamburgerBtn" type="button" aria-label="Buka menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<main class="stage">
  <div class="page-head">
    <h1>Share Code</h1>
    <p>Tempel atau upload kode, dapatkan link buat lihat kode dan link raw. <a href="/share/list">Lihat semua kode →</a></p>
  </div>

  <div class="panel">
    <div class="row">
      <div class="field">
        <label for="filenameInput">Nama File (opsional)</label>
        <input type="text" id="filenameInput" placeholder="contoh: index.js" />
      </div>
    </div>

    <div class="field">
      <label for="codeInput">Kode</label>
      <textarea id="codeInput" placeholder="Tempel kode di sini..." spellcheck="false"></textarea>
    </div>

    <input type="file" id="fileInput" hidden />

    <div class="actions">
      <button class="btn btn-ghost" id="uploadBtn" type="button">Upload File</button>
      <button class="btn btn-primary" id="shareBtn" type="button">Share Code</button>
    </div>

    <div class="banner" id="banner"></div>

    <div class="result" id="result">
      <div class="result-row">
        <span class="result-row-label">View</span>
        <a id="viewLink" href="#" target="_blank" rel="noopener"></a>
        <button type="button" data-copy="viewLink">Copy</button>
      </div>
      <div class="result-row">
        <span class="result-row-label">Raw</span>
        <a id="rawLink" href="#" target="_blank" rel="noopener"></a>
        <button type="button" data-copy="rawLink">Copy</button>
      </div>
      <p class="result-note" id="expiryNote"></p>
      <button class="btn btn-ghost" id="deleteBtn" type="button">Hapus Kode Ini</button>
    </div>
  </div>
</main>

<div class="menu-overlay" id="menuOverlay"></div>

<div class="hamburger-menu" id="hamburgerMenu">
  <div class="hamburger-menu-title">Menu</div>
  <a href="/" class="hamburger-menu-item">
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/></svg>
    Beranda
  </a>
  <a href="/docs" class="hamburger-menu-item">
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    Docs
  </a>
  <a href="/logs" class="hamburger-menu-item">
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v2H4V4zm0 7h16v2H4v-2zm0 7h10v2H4v-2z" fill="currentColor"/></svg>
    Request Log
  </a>
  <a href="/health" class="hamburger-menu-item">
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    Health
  </a>
  <a href="/share" class="hamburger-menu-item is-active">
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    Share Code
  </a>
  <a href="/share/list" class="hamburger-menu-item">
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v2H4V4zm0 7h16v2H4v-2zm0 7h10v2H4v-2z"/></svg>
    Semua Kode
  </a>
  <div class="hamburger-menu-spacer"></div>
  <div class="hamburger-menu-contacts">
    <a href="#" id="waChannelMenuItem" class="hamburger-menu-contact-link" target="_blank" rel="noopener" hidden>Saluran WhatsApp</a>
    <a href="#" id="ownerContactMenuItem" class="hamburger-menu-contact-link" target="_blank" rel="noopener" hidden>Contact Owner</a>
  </div>
</div>

<script src="/click-sound.js"></script>
<script src="/menu-contacts.js"></script>
<script>
(() => {
  'use strict';

  const el = (id) => document.getElementById(id);
  const codeInput = el('codeInput');
  const filenameInput = el('filenameInput');
  const fileInput = el('fileInput');
  const uploadBtn = el('uploadBtn');
  const shareBtn = el('shareBtn');
  const banner = el('banner');
  const result = el('result');
  const viewLink = el('viewLink');
  const rawLink = el('rawLink');
  const expiryNote = el('expiryNote');
  const deleteBtn = el('deleteBtn');

  let currentId = null;
  let currentToken = null;

  const formatDate = (iso) => new Date(iso).toLocaleString('id-ID', {
    day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });

  const showBanner = (msg, isError) => {
    banner.textContent = msg;
    banner.className = `banner ${isError ? 'is-error' : 'is-good'}`;
  };
  const hideBanner = () => { banner.className = 'banner'; };

  uploadBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      codeInput.value = reader.result;
      if (!filenameInput.value.trim()) filenameInput.value = file.name;
    };
    reader.readAsText(file);
  });

  shareBtn.addEventListener('click', async () => {
    const code = codeInput.value;
    hideBanner();
    result.classList.remove('is-open');

    if (!code.trim()) {
      showBanner('Kode tidak boleh kosong.', true);
      return;
    }

    shareBtn.disabled = true;
    shareBtn.textContent = 'Sharing...';

    try {
      const res = await fetch('/api/share', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, filename: filenameInput.value })
      });
      const data = await res.json();

      if (!res.ok || !data.ok) {
        showBanner(data?.error?.message || 'Gagal share kode.', true);
        return;
      }

      viewLink.href = data.result.viewUrl;
      viewLink.textContent = data.result.viewUrl;
      rawLink.href = data.result.rawUrl;
      rawLink.textContent = data.result.rawUrl;
      currentId = data.result.id;
      currentToken = data.result.deleteToken;
      expiryNote.textContent = `Otomatis kadaluarsa: ${formatDate(data.result.expiresAt)}`;
      deleteBtn.disabled = false;
      deleteBtn.textContent = 'Hapus Kode Ini';
      result.classList.add('is-open');
      showBanner('Kode berhasil di-share.', false);
    } catch (err) {
      showBanner('Gagal konek ke server.', true);
    } finally {
      shareBtn.disabled = false;
      shareBtn.textContent = 'Share Code';
    }
  });

  deleteBtn.addEventListener('click', async () => {
    if (!currentId || !currentToken) return;
    deleteBtn.disabled = true;
    deleteBtn.textContent = 'Menghapus...';
    try {
      const res = await fetch(`/api/share/${currentId}`, {
        method: 'DELETE',
        headers: { 'x-delete-token': currentToken }
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        showBanner(data?.error?.message || 'Gagal menghapus kode.', true);
        deleteBtn.disabled = false;
        deleteBtn.textContent = 'Hapus Kode Ini';
        return;
      }
      result.classList.remove('is-open');
      currentId = null;
      currentToken = null;
      showBanner('Kode berhasil dihapus.', false);
    } catch (err) {
      showBanner('Gagal konek ke server.', true);
      deleteBtn.disabled = false;
      deleteBtn.textContent = 'Hapus Kode Ini';
    }
  });

  document.querySelectorAll('[data-copy]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const target = el(btn.dataset.copy);
      navigator.clipboard.writeText(target.href).then(() => {
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; }, 1200);
      });
    });
  });

  const hamburgerBtn = el('hamburgerBtn');
  const hamburgerMenu = el('hamburgerMenu');
  const menuOverlay = el('menuOverlay');

  const openMenu = () => {
    hamburgerBtn.classList.add('is-open');
    hamburgerBtn.setAttribute('aria-expanded', 'true');
    hamburgerMenu.classList.add('is-open');
    menuOverlay.classList.add('is-open');
    document.body.style.overflow = 'hidden';
  };
  const closeMenu = () => {
    hamburgerBtn.classList.remove('is-open');
    hamburgerBtn.setAttribute('aria-expanded', 'false');
    hamburgerMenu.classList.remove('is-open');
    menuOverlay.classList.remove('is-open');
    document.body.style.overflow = '';
  };
  hamburgerBtn.addEventListener('click', () => {
    if (hamburgerMenu.classList.contains('is-open')) closeMenu();
    else openMenu();
  });
  menuOverlay.addEventListener('click', closeMenu);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && hamburgerMenu.classList.contains('is-open')) closeMenu();
  });
})();
</script>

</body>
</html>
